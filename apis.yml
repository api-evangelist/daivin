aid: daivin
name: Daivin
description: 'DAIVIN! is a deep-tech hardware company (Y Combinator Winter 2026, based
  in San Francisco and Finland) building tankless diving technology. Its core product,
  SPRING, is marketed as the "world''s first tankless diving technology": instead of
  carrying heavy pressurized oxygen tanks, a diver wears a lightweight vest of electrolyzers
  and a battery belt that use electricity to split water on demand into breathable
  oxygen (O2) and hydrogen (H2), targeting depths up to 200 meters / 650 ft. Founder
  Leo Kankkunen frames breathing as "fundamentally an energy problem," and the company
  envisions applications beyond recreational and professional diving across space exploration,
  high-altitude rescue, hospitals, and aircraft. Added to the API Evangelist network
  as a venture-capital portfolio lead surfaced via y-combinator. Daivin runs a conceptual
  marketing website (Wix) and a news blog; it publishes no public API, developer portal,
  SDK, or other machine-readable developer surface, so no API artifacts apply to this
  provider.'
